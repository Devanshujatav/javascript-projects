<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="clock-card">
        <p class="greeting" id="greeting">
            Good Morning
        </p>

        <div class="display">
            <span class="time" id="time">
                00:00:00
            </span>
            <button class="format-toggle" id="formatToggle" aria-pressed="false" aria-label="Switch to 12-hour format">
                24H
            </button>
        </div>

        <p class="date" id="date">
            Monday, January 1
        </p>

        <div class="segment-strip" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </main>

    <script src="./script.js"></script>
    
</body>
</html>
